# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.0              9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#   actions/configure-pages@v5           983d7736d9b0ae728b81ab479565c72886d7745b
#   actions/upload-pages-artifact@v5.0.0 fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages@v5.0.1          368f82528645a54fb793d4d04e342629a3f51346
#
# Secure use: least privilege, SHA-pinned actions, no pull_request_target.
# https://docs.github.com/en/actions/reference/security/secure-use

name: Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch models
        run: |
          bash scripts/fetch-models.sh
          bash scripts/fetch-transformers.sh
          # Quick WebGPU weights only (Pages size). WASM covers the rest.
          bash -c '
            set -euo pipefail
            id=whisper-tiny.en
            OUT=web/models/onnx/$id
            HF=https://huggingface.co/onnx-community/$id/resolve/main
            mkdir -p "$OUT/onnx"
            for f in config.json tokenizer.json tokenizer_config.json preprocessor_config.json generation_config.json special_tokens_map.json added_tokens.json normalizer.json; do
              curl -L --fail --retry 3 -o "$OUT/$f" "$HF/$f" || rm -f "$OUT/$f"
            done
            curl -L --fail --retry 5 -o "$OUT/onnx/encoder_model.onnx" "$HF/onnx/encoder_model.onnx"
            curl -L --fail --retry 5 -o "$OUT/onnx/decoder_model_merged_q4.onnx" "$HF/onnx/decoder_model_merged_q4.onnx"
          '

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
